name: Droid Build

# Fired by factory-bridge when a reviewed Linear ticket is moved to the build state
# or gets an @droid comment. Droid implements it; this workflow pushes and opens the PR.

on:
  repository_dispatch:
    types: [droid-build]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: droid-build-${{ github.event.client_payload.issueId }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ISSUE_ID: ${{ github.event.client_payload.issueId }}
      LINEAR_TEAM_KEY: ${{ vars.LINEAR_TEAM_KEY }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load Linear ticket
        id: issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node .github/droid-bridge/bridge.mjs get-issue --issue "$ISSUE_ID"

      - name: Check for an existing PR
        id: gate
        if: steps.issue.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [ -n "$existing" ]; then
            node .github/droid-bridge/bridge.mjs update --issue "$ISSUE_ID" \
              --comment "A pull request for this ticket is already open: $existing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce start
        if: steps.gate.outputs.go == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          IDENT: ${{ steps.issue.outputs.identifier }}
        run: |
          node .github/droid-bridge/bridge.mjs update --issue "$ISSUE_ID" --state "In Progress" \
            --comment "🤖 Factory Droid picked this up and is building it. [Watch the run]($RUN_URL)" \
            --slack "🛠️ $IDENT was approved. Droid is building it now. <$RUN_URL|Watch the run>"

      - name: Set up Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Install Factory Droid
        if: steps.gate.outputs.go == 'true'
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prepare branch and prompt
        if: steps.gate.outputs.go == 'true'
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
        run: |
          git config user.name "factory-droid[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          cat .github/droid-bridge/build-prompt.md "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/prompt.md"

      - name: Implement with Droid
        if: steps.gate.outputs.go == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          DROID_MODEL: ${{ vars.DROID_MODEL }}
          IDENT: ${{ steps.issue.outputs.identifier }}
          TITLE: ${{ steps.issue.outputs.title }}
        run: |
          droid exec --auto medium -o json ${DROID_MODEL:+--model "$DROID_MODEL"} \
            -f "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/droid.json"
          jq -r '.result // empty' "$RUNNER_TEMP/droid.json" > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # Commit anything Droid left uncommitted.
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: $TITLE ($IDENT)"
          fi
          if [ "$(git rev-list --count "origin/$BASE_BRANCH..HEAD")" -eq 0 ]; then
            echo "::error::Droid finished without making any changes"
            exit 1
          fi

      - name: Push branch and open PR
        id: pr
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          IDENT: ${{ steps.issue.outputs.identifier }}
          TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          {
            cat "$RUNNER_TEMP/summary.md"
            printf '\n\n---\n\nFixes [%s](%s)\n\n' "$IDENT" "$ISSUE_URL"
            echo "_Requested in Slack, specced and implemented by Factory Droid. [Build run]($RUN_URL)_"
          } > "$RUNNER_TEMP/pr-body.md"
          url=$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "$IDENT: $TITLE" --body-file "$RUNNER_TEMP/pr-body.md")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Announce PR
        if: steps.gate.outputs.go == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          IDENT: ${{ steps.issue.outputs.identifier }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          node .github/droid-bridge/bridge.mjs update --issue "$ISSUE_ID" --state "In Review" \
            --comment "✅ Pull request opened: $PR_URL" \
            --slack "✅ <$PR_URL|PR for $IDENT> is up. Droid Review will run on it next."

      - name: Report failure
        if: failure() && steps.gate.outputs.go == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          IDENT: ${{ steps.issue.outputs.identifier }}
        run: |
          node .github/droid-bridge/bridge.mjs update --issue "$ISSUE_ID" \
            --comment "❌ The Droid build failed. [See the run]($RUN_URL)" \
            --slack "❌ The Droid build for $IDENT failed. <$RUN_URL|See the run>"
