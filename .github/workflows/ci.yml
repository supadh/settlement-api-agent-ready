name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: time python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          time python -m compileall -q
          main.py reconcile.py feature_flags.py logging_config.py metrics.py
          observability.py privacy.py secret_config.py scripts tests

      - name: Validate agent documentation
        run: python scripts/validate_agent_docs.py

      - name: Validate supply-chain policy
        run: python scripts/validate_supply_chain.py

      - name: Run maintainability gates
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Verify generated API schema is current
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- openapi.json

      - name: Run tests with timing
        run: |
          mkdir -p test-results
          time python -m pytest --durations=10 --junitxml=test-results/junit.xml

      - name: Run interactive API smoke test
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Upload test timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/junit.xml
          if-no-files-found: error
          retention-days: 14
