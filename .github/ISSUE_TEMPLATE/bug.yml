name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected and what is the financial or operational impact?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data only. Never include card tokens or personal data.
      placeholder: |
        1. Start the API with...
        2. Send...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that prove the defect is fixed.
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security or sensitive-data impact
      options:
        - None known
        - Potential security impact
        - Potential sensitive-data exposure
    validations:
      required: true
